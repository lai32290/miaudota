<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Cartão de Adoção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f1ef;
    --panel:#ffffff;
    --text:#1a1a1f;
    --muted:#6b6d76;
    --border:#e3e2df;
    --accent:#c2168d;
    --accent-ink:#ffffff;
    --field-bg:#f7f6f4;
    --shadow: 0 24px 48px -20px rgba(20,15,25,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131318;
      --panel:#1b1b22;
      --text:#f1f0f4;
      --muted:#9a9aa6;
      --border:#2c2c35;
      --field-bg:#232329;
      --shadow: 0 24px 48px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131318;
    --panel:#1b1b22;
    --text:#f1f0f4;
    --muted:#9a9aa6;
    --border:#2c2c35;
    --field-bg:#232329;
    --shadow: 0 24px 48px -20px rgba(0,0,0,0.6);
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;
  }
  .app{ max-width:1160px; margin:0 auto; padding:28px 20px 64px; }
  header{ margin-bottom:24px; }
  header h1{ font-size:22px; font-weight:800; margin:0 0 6px; letter-spacing:-0.01em; }
  header p{ margin:0; color:var(--muted); font-size:14px; line-height:1.5; max-width:56ch; }

  main{ display:grid; grid-template-columns:1fr; gap:28px; }
  @media (min-width:960px){
    main{ grid-template-columns:420px 1fr; align-items:start; }
  }

  .preview-pane{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .canvas-wrap{
    position:relative;
    flex:none;
    width:auto;
    height:40vh;
    aspect-ratio:4/5;
    border-radius:10px;
    overflow:hidden;
    box-shadow:var(--shadow);
    background:var(--panel);
    border:1px solid var(--border);
    cursor:pointer;
    transition:width .2s ease, height .2s ease;
  }
  .canvas-wrap.expanded{
    height:60vh;
    border-radius:18px;
  }
  .canvas-wrap::after{
    content:"⤢";
    position:absolute; bottom:3px; right:3px;
    width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; background:rgba(0,0,0,0.5);
    border-radius:4px; pointer-events:none;
  }
  canvas{ width:100%; height:100%; display:block; }

  .preview-actions{ width:100%; }

  @media (min-width:960px){
    .preview-pane{ position:sticky; top:20px; z-index:999; flex-direction:row; align-items:flex-start; flex-wrap:wrap; }
    .canvas-wrap{ width:220px; height:auto; }
    .canvas-wrap.expanded{ width:300px; height:auto; }
    .preview-actions{ flex:1; min-width:150px; width:auto; }
  }

  .primary-btn{
    width:100%;
    margin-top:0;
    padding:14px 18px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .primary-btn:disabled{ opacity:0.5; cursor:default; }
  .primary-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .hint{ margin:10px 2px 0; font-size:12.5px; color:var(--muted); min-height:16px; }

  .controls-pane{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:8px 22px 22px;
  }
  .field-group{ padding:18px 0; border-top:1px solid var(--border); }
  .field-group:first-child{ border-top:none; }
  .field-group h2{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin:0 0 14px; }

  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field label{ font-size:13.5px; font-weight:600; color:var(--text); }
  .field .row{ display:flex; align-items:center; justify-content:space-between; }
  .field .row span{ font-size:12.5px; color:var(--muted); font-weight:500; }

  input[type="text"], textarea, select{
    width:100%;
    font-family:inherit;
    font-size:14.5px;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--field-bg);
    color:var(--text);
    resize:none;
  }
  input[type="text"]:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }

  input[type="range"]{ width:100%; accent-color:var(--accent); }

  .preset-actions{ display:flex; gap:10px; margin-top:10px; }
  .preset-actions .link-btn{ margin-top:0; }
  .preset-hint{ margin:8px 2px 0; font-size:12.5px; color:var(--muted); min-height:16px; }

  input[type="color"]{
    width:44px; height:32px; padding:0; border:1px solid var(--border);
    border-radius:8px; background:none; cursor:pointer;
  }

  .upload-btn{
    display:flex; align-items:center; justify-content:center;
    padding:12px 14px; border-radius:10px;
    border:1.5px dashed var(--border);
    color:var(--text); font-weight:600; font-size:14px;
    cursor:pointer; text-align:center;
  }
  .upload-btn:hover{ border-color:var(--accent); }
  .upload-btn.has-file{ border-style:solid; }

  .sex-switch-row{ display:flex; align-items:center; gap:12px; }
  .sex-label{ font-size:13.5px; font-weight:600; color:var(--muted); }
  .sex-label.active{ color:var(--text); }
  .switch{ position:relative; width:44px; height:24px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .track{
    position:absolute; inset:0; background:var(--border); border-radius:20px; cursor:pointer;
  }
  .switch .track::after{
    content:""; position:absolute; width:18px; height:18px; left:3px; top:3px;
    background:#fff; border-radius:50%; transition:transform .15s ease;
  }
  .switch input:checked + .track{ background:var(--accent); }
  .switch input:checked + .track::after{ transform:translateX(20px); }

  .checkbox-label{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    font-size:13.5px; font-weight:600; color:var(--text);
  }
  .checkbox-label input[type="checkbox"]{
    width:18px; height:18px; accent-color:var(--accent); cursor:pointer;
  }

  .link-btn{
    background:none; border:none; padding:0; margin-top:8px;
    color:var(--muted); font-size:12.5px; text-decoration:underline;
    cursor:pointer; font-family:inherit;
  }
  .link-btn:hover{ color:var(--text); }
  .link-btn.danger{ color:#d24545; font-weight:700; text-decoration:none; }
  .link-btn.danger:hover{ color:#b32e2e; }

  .reset-row{ margin-top:18px; text-align:right; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Gerador de cartão de adoção</h1>
    <p>Envie a foto do animal, edite os textos de cada campo e baixe a imagem pronta para postar.</p>
  </header>

  <main>
    <section class="preview-pane">
      <div class="canvas-wrap" id="canvasWrap" title="Clique para ampliar ou reduzir">
        <canvas id="cardCanvas" width="1200" height="1500"></canvas>
      </div>
      <div class="preview-actions">
        <button id="downloadBtn" class="primary-btn" disabled>Carregando…</button>
        <p id="downloadHint" class="hint"></p>
      </div>
    </section>

    <section class="controls-pane">
      <div class="field-group">
        <h2>Foto</h2>
        <div class="field">
          <label class="upload-btn" id="photoUploadLabel" for="photoInput">Enviar foto do animal</label>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>
        <div class="field">
          <div class="row"><label for="photoOffsetY">Posição vertical</label><span id="offsetYValue">50%</span></div>
          <input type="range" id="photoOffsetY" min="0" max="100" value="50">
        </div>
        <div class="field">
          <div class="row"><label for="photoZoom">Zoom</label><span id="zoomValue">100%</span></div>
          <input type="range" id="photoZoom" min="100" max="200" value="100">
        </div>
      </div>

      <div class="field-group">
        <h2>Textos</h2>
        <div class="field">
          <label for="nameInput">Nome</label>
          <input type="text" id="nameInput" maxlength="30" value="LARACREME">
        </div>
        <div class="field">
          <div class="row"><label for="nameFontSize">Tamanho da fonte do nome</label><span id="nameFontSizeValue">100%</span></div>
          <input type="range" id="nameFontSize" min="50" max="150" value="100">
        </div>
        <div class="field">
          <label>Sexo</label>
          <div class="sex-switch-row">
            <span class="sex-label" id="sexLabelMacho">Macho</span>
            <span class="switch">
              <input type="checkbox" id="sexoSwitch" checked>
              <span class="track" onclick="document.getElementById('sexoSwitch').click()"></span>
            </span>
            <span class="sex-label" id="sexLabelFemea">Fêmea</span>
          </div>
        </div>
        <div class="field">
          <label class="checkbox-label" for="castradoCheckbox">
            <input type="checkbox" id="castradoCheckbox" checked>
            <span id="castradoLabelText">Castrada</span>
          </label>
        </div>
        <div class="field">
          <label for="idadeInput">Idade</label>
          <input type="text" id="idadeInput" maxlength="20" value="5 ANOS">
        </div>
        <div class="field">
          <label for="footerInput">Texto de chamada (rodapé)</label>
          <textarea id="footerInput" maxlength="140" rows="2">Para adoção, preencha o formulário que está no link da bio.</textarea>
        </div>
      </div>

      <div class="field-group">
        <h2>Aparência</h2>
        <div class="field">
          <div class="row"><label for="bannerColor">Cor da faixa do nome</label></div>
          <input type="color" id="bannerColor" value="#c2168d">
        </div>
        <div class="field">
          <div class="row"><label for="footerColor">Cor do rodapé</label></div>
          <input type="color" id="footerColor" value="#15151d">
        </div>
        <div class="field">
          <label class="upload-btn" id="logoUploadLabel" for="logoInput">Enviar logo (opcional)</label>
          <input type="file" id="logoInput" accept="image/*" hidden>
          <button id="clearLogoBtn" class="link-btn" style="display:none;">Remover logo</button>
        </div>
      </div>

      <div class="field-group">
        <h2>Imagem extra (opcional)</h2>
        <div class="field">
          <label class="upload-btn" id="overlayUploadLabel" for="overlayInput">Enviar imagem/adesivo</label>
          <input type="file" id="overlayInput" accept="image/*" hidden>
          <button id="clearOverlayBtn" class="link-btn" style="display:none;">Remover imagem extra</button>
        </div>
        <div class="field">
          <div class="row"><label for="overlaySize">Tamanho</label><span id="overlaySizeValue">25%</span></div>
          <input type="range" id="overlaySize" min="5" max="100" value="25">
        </div>
        <div class="field">
          <div class="row"><label for="overlayRotation">Rotação</label><span id="overlayRotationValue">0°</span></div>
          <input type="range" id="overlayRotation" min="0" max="360" value="0">
        </div>
        <div class="field">
          <div class="row"><label for="overlayX">Posição horizontal</label><span id="overlayXValue">50%</span></div>
          <input type="range" id="overlayX" min="0" max="100" value="50">
        </div>
        <div class="field">
          <div class="row"><label for="overlayY">Posição vertical</label><span id="overlayYValue">50%</span></div>
          <input type="range" id="overlayY" min="0" max="100" value="50">
        </div>
      </div>

      <div class="field-group">
        <h2>Configurações salvas</h2>
        <div class="field">
          <label for="presetNameInput">Nome da configuração</label>
          <input type="text" id="presetNameInput" maxlength="30" placeholder="Ex: Padrão da ONG">
        </div>
        <button id="savePresetBtn" class="primary-btn" style="margin-top:0;">Salvar configuração</button>
        <p id="presetSaveHint" class="preset-hint"></p>

        <div class="field" style="margin-top:16px;">
          <label for="presetSelect">Configurações salvas</label>
          <select id="presetSelect"><option value="">Nenhuma salva ainda</option></select>
        </div>
        <div class="preset-actions">
          <button id="loadPresetBtn" class="link-btn">Restaurar selecionada</button>
          <button id="deletePresetBtn" class="link-btn">Excluir selecionada</button>
        </div>
      </div>

      <div class="reset-row">
        <button id="resetBtn" class="link-btn">Restaurar padrões</button>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const DEFAULTS = {
    name: 'LARACREME',
    nameFontScale: 1,
    sexo: 'femea',
    castrado: true,
    idade: '5 ANOS',
    footerText: 'Para adoção, preencha o formulário que está no link da bio.',
    bannerColor: '#c2168d',
    footerColor: '#15151d',
    panY: 50,
    zoom: 100
  };

  // fields that make up a saveable "configuração" preset — deliberately
  // excludes the uploaded photo/logo, which are per-animal, not per-style
  const PRESET_FIELDS = ['name', 'nameFontScale', 'sexo', 'castrado', 'idade', 'footerText', 'bannerColor', 'footerColor', 'panY', 'zoom'];
  const PRESETS_KEY = 'cartaoAdocaoPresets_v1';

  const state = {
    photo: null,
    logo: null,
    overlayImage: null,
    overlaySize: 25,
    overlayRotation: 0,
    overlayX: 50,
    overlayY: 50,
    ...DEFAULTS
  };

  const els = {
    canvasWrap: document.getElementById('canvasWrap'),
    photoInput: document.getElementById('photoInput'),
    photoUploadLabel: document.getElementById('photoUploadLabel'),
    logoInput: document.getElementById('logoInput'),
    logoUploadLabel: document.getElementById('logoUploadLabel'),
    clearLogoBtn: document.getElementById('clearLogoBtn'),
    overlayInput: document.getElementById('overlayInput'),
    overlayUploadLabel: document.getElementById('overlayUploadLabel'),
    clearOverlayBtn: document.getElementById('clearOverlayBtn'),
    overlaySize: document.getElementById('overlaySize'),
    overlaySizeValue: document.getElementById('overlaySizeValue'),
    overlayRotation: document.getElementById('overlayRotation'),
    overlayRotationValue: document.getElementById('overlayRotationValue'),
    overlayX: document.getElementById('overlayX'),
    overlayXValue: document.getElementById('overlayXValue'),
    overlayY: document.getElementById('overlayY'),
    overlayYValue: document.getElementById('overlayYValue'),
    offsetY: document.getElementById('photoOffsetY'),
    offsetYValue: document.getElementById('offsetYValue'),
    zoom: document.getElementById('photoZoom'),
    zoomValue: document.getElementById('zoomValue'),
    name: document.getElementById('nameInput'),
    nameFontSize: document.getElementById('nameFontSize'),
    nameFontSizeValue: document.getElementById('nameFontSizeValue'),
    sexoSwitch: document.getElementById('sexoSwitch'),
    sexLabelMacho: document.getElementById('sexLabelMacho'),
    sexLabelFemea: document.getElementById('sexLabelFemea'),
    castradoCheckbox: document.getElementById('castradoCheckbox'),
    castradoLabelText: document.getElementById('castradoLabelText'),
    idade: document.getElementById('idadeInput'),
    footer: document.getElementById('footerInput'),
    bannerColor: document.getElementById('bannerColor'),
    footerColor: document.getElementById('footerColor'),
    resetBtn: document.getElementById('resetBtn'),
    presetNameInput: document.getElementById('presetNameInput'),
    savePresetBtn: document.getElementById('savePresetBtn'),
    presetSaveHint: document.getElementById('presetSaveHint'),
    presetSelect: document.getElementById('presetSelect'),
    loadPresetBtn: document.getElementById('loadPresetBtn'),
    deletePresetBtn: document.getElementById('deletePresetBtn'),
    downloadBtn: document.getElementById('downloadBtn'),
    downloadHint: document.getElementById('downloadHint')
  };

  function loadImageFile(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function drawCoverImage(c, img, x, y, w, h, panYPercent, zoomPercent){
    const scaleBase = Math.max(w / img.width, h / img.height);
    const scale = scaleBase * (zoomPercent / 100);
    const iw = img.width * scale, ih = img.height * scale;
    const dx = x + (w - iw) / 2;
    const maxOffset = Math.max(0, ih - h);
    const dy = y - maxOffset * (panYPercent / 100);
    c.drawImage(img, dx, dy, iw, ih);
  }

  function textWidthSpaced(c, text, spacing){
    let w = 0;
    for (const ch of text) w += c.measureText(ch).width + spacing;
    return text.length ? w - spacing : 0;
  }

  function fillTextSpaced(c, text, cx, cy, spacing){
    const totalWidth = textWidthSpaced(c, text, spacing);
    let x = cx - totalWidth / 2;
    const prevAlign = c.textAlign;
    c.textAlign = 'left';
    for (const ch of text){
      c.fillText(ch, x, cy);
      x += c.measureText(ch).width + spacing;
    }
    c.textAlign = prevAlign;
  }

  function drawFittedText(c, text, cx, cy, maxWidth, maxFont, minFont, weight, color, spacing, fontFamily){
    fontFamily = fontFamily || 'Poppins, sans-serif';
    let fontSize = maxFont;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    while (fontSize > minFont){
      c.font = `${weight} ${fontSize}px ${fontFamily}`;
      const w = spacing ? textWidthSpaced(c, text, spacing) : c.measureText(text).width;
      if (w <= maxWidth) break;
      fontSize -= 2;
    }
    c.font = `${weight} ${fontSize}px ${fontFamily}`;
    c.fillStyle = color;
    if (spacing) fillTextSpaced(c, text, cx, cy, spacing);
    else c.fillText(text, cx, cy);
  }

  function drawFittedTextLeft(c, text, x, cy, maxWidth, maxFont, minFont, weight, color, fontFamily){
    fontFamily = fontFamily || 'Poppins';
    let fontSize = maxFont;
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    while (fontSize > minFont){
      c.font = `${weight} ${fontSize}px ${fontFamily}, sans-serif`;
      if (c.measureText(text || '').width <= maxWidth) break;
      fontSize -= 1;
    }
    c.font = `${weight} ${fontSize}px ${fontFamily}, sans-serif`;
    let display = text || '';
    if (c.measureText(display).width > maxWidth){
      while (display.length > 0 && c.measureText(display + '…').width > maxWidth){
        display = display.slice(0, -1);
      }
      display = display.trimEnd() + '…';
    }
    c.fillStyle = color;
    c.fillText(display, x, cy);
  }

  function render(){
    ctx.clearRect(0, 0, W, H);

    // photo fills the entire canvas — the colored block floats on top of it
    // near the bottom, so the photo stays visible around the block's sides
    if (state.photo){
      drawCoverImage(ctx, state.photo, 0, 0, W, H, state.panY, state.zoom);
    } else {
      ctx.fillStyle = '#d9dbe0';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#8b8e98';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 64px Poppins, sans-serif';
      ctx.fillText('📷', W / 2, H * 0.38 - 40);
      ctx.font = '600 30px Poppins, sans-serif';
      ctx.fillText('Envie uma foto para começar', W / 2, H * 0.38 + 34);
    }

    // floating rounded block: side + bottom margins reveal the photo,
    // matching the reference template (it is not a full-bleed bar)
    const blockLeft = W * 0.055;
    const blockRight = W * 0.945;
    const blockWidth = blockRight - blockLeft;
    const blockTop = H * 0.772;
    const blockBottom = H * 0.937;
    const blockHeight = blockBottom - blockTop;
    const bannerH = blockHeight * 0.648;
    const footerH = blockHeight - bannerH;
    const circleR = blockHeight * 0.33;

    ctx.save();
    ctx.beginPath();
    ctx.rect(blockLeft, blockTop, blockWidth, blockHeight);
    ctx.clip();

    // banner (name + subtitle)
    ctx.fillStyle = state.bannerColor;
    ctx.fillRect(blockLeft, blockTop, blockWidth, bannerH);
    drawFittedText(ctx, (state.name || '').toUpperCase(), blockLeft + blockWidth / 2, blockTop + bannerH * 0.4, blockWidth * 0.9, blockHeight * 0.34 * state.nameFontScale, blockHeight * 0.1, 800, '#ffffff', 0, '"Gotham", "Montserrat", sans-serif');
    const sexoLabel = state.sexo === 'femea' ? 'FÊMEA' : 'MACHO';
    const castradoLabel = state.castrado
      ? (state.sexo === 'femea' ? 'CASTRADA' : 'CASTRADO')
      : '';
    const subtitle = [sexoLabel, castradoLabel, state.idade].filter(Boolean).join(' • ');
    drawFittedText(ctx, subtitle.toUpperCase(), blockLeft + blockWidth / 2, blockTop + bannerH * 0.78, blockWidth * 0.9, blockHeight * 0.135, blockHeight * 0.07, 600, 'rgba(255,255,255,0.92)', 2, '"Gotham", "Montserrat", sans-serif');

    // footer (call to action + badge)
    ctx.fillStyle = state.footerColor;
    ctx.fillRect(blockLeft, blockTop + bannerH, blockWidth, footerH);

    // badge sits exactly in the block's corner — tangent to its right and
    // bottom edges, poking up into the banner, matching the reference
    const badgeCx = blockRight - circleR;
    const badgeCy = blockBottom - circleR;
    const logoSize = circleR * 1.3;

    drawFittedTextLeft(ctx, state.footerText, blockLeft + blockWidth * 0.04, blockTop + bannerH + footerH / 2, blockWidth * 0.72, blockHeight * 0.16, blockHeight * 0.06, 400, 'rgba(255,255,255,0.88)', 'Varela Round');

    // badge — round background matching the footer color, with the square logo inset
    ctx.beginPath();
    ctx.fillStyle = state.footerColor;
    ctx.arc(badgeCx, badgeCy, circleR, 0, Math.PI * 2);
    ctx.fill();
    if (state.logo){
      ctx.save();
      ctx.beginPath();
      ctx.rect(badgeCx - logoSize / 2, badgeCy - logoSize / 2, logoSize, logoSize);
      ctx.clip();
      drawCoverImage(ctx, state.logo, badgeCx - logoSize / 2, badgeCy - logoSize / 2, logoSize, logoSize, 50, 100);
      ctx.restore();
    } else {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.round(circleR * 0.9)}px Poppins, sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('🐾', badgeCx, badgeCy + circleR * 0.05);
    }

    ctx.restore();

    // extra image/sticker — free position, size and rotation, drawn on
    // top of the whole card
    if (state.overlayImage){
      const ovW = W * (state.overlaySize / 100);
      const ovH = ovW * (state.overlayImage.height / state.overlayImage.width);
      const ovCx = W * (state.overlayX / 100);
      const ovCy = H * (state.overlayY / 100);
      ctx.save();
      ctx.translate(ovCx, ovCy);
      ctx.rotate(state.overlayRotation * Math.PI / 180);
      ctx.drawImage(state.overlayImage, -ovW / 2, -ovH / 2, ovW, ovH);
      ctx.restore();
    }
  }

  function scheduleRender(){ requestAnimationFrame(render); }

  // ---- wiring ----
  els.photoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      state.photo = await loadImageFile(file);
      els.photoUploadLabel.textContent = 'Trocar foto';
      els.photoUploadLabel.classList.add('has-file');
      scheduleRender();
    } catch(_) {}
  });

  els.logoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      state.logo = await loadImageFile(file);
      els.logoUploadLabel.textContent = 'Trocar logo';
      els.logoUploadLabel.classList.add('has-file');
      els.clearLogoBtn.style.display = 'inline';
      scheduleRender();
    } catch(_) {}
  });

  els.clearLogoBtn.addEventListener('click', () => {
    state.logo = null;
    els.logoInput.value = '';
    els.logoUploadLabel.textContent = 'Enviar logo (opcional)';
    els.logoUploadLabel.classList.remove('has-file');
    els.clearLogoBtn.style.display = 'none';
    scheduleRender();
  });

  els.overlayInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      state.overlayImage = await loadImageFile(file);
      els.overlayUploadLabel.textContent = 'Trocar imagem extra';
      els.overlayUploadLabel.classList.add('has-file');
      els.clearOverlayBtn.style.display = 'inline';
      scheduleRender();
    } catch(_) {}
  });

  els.clearOverlayBtn.addEventListener('click', () => {
    state.overlayImage = null;
    els.overlayInput.value = '';
    els.overlayUploadLabel.textContent = 'Enviar imagem/adesivo';
    els.overlayUploadLabel.classList.remove('has-file');
    els.clearOverlayBtn.style.display = 'none';
    scheduleRender();
  });

  els.overlaySize.addEventListener('input', () => {
    state.overlaySize = Number(els.overlaySize.value);
    els.overlaySizeValue.textContent = state.overlaySize + '%';
    scheduleRender();
  });
  els.overlayRotation.addEventListener('input', () => {
    state.overlayRotation = Number(els.overlayRotation.value);
    els.overlayRotationValue.textContent = state.overlayRotation + '°';
    scheduleRender();
  });
  els.overlayX.addEventListener('input', () => {
    state.overlayX = Number(els.overlayX.value);
    els.overlayXValue.textContent = state.overlayX + '%';
    scheduleRender();
  });
  els.overlayY.addEventListener('input', () => {
    state.overlayY = Number(els.overlayY.value);
    els.overlayYValue.textContent = state.overlayY + '%';
    scheduleRender();
  });

  els.offsetY.addEventListener('input', () => {
    state.panY = Number(els.offsetY.value);
    els.offsetYValue.textContent = state.panY + '%';
    scheduleRender();
  });
  els.zoom.addEventListener('input', () => {
    state.zoom = Number(els.zoom.value);
    els.zoomValue.textContent = state.zoom + '%';
    scheduleRender();
  });

  function updateSexUI(){
    els.sexoSwitch.checked = state.sexo === 'femea';
    els.sexLabelMacho.classList.toggle('active', state.sexo === 'macho');
    els.sexLabelFemea.classList.toggle('active', state.sexo === 'femea');
    els.castradoLabelText.textContent = state.sexo === 'femea' ? 'Castrada' : 'Castrado';
  }

  els.name.addEventListener('input', () => { state.name = els.name.value; scheduleRender(); });
  els.nameFontSize.addEventListener('input', () => {
    state.nameFontScale = Number(els.nameFontSize.value) / 100;
    els.nameFontSizeValue.textContent = els.nameFontSize.value + '%';
    scheduleRender();
  });
  els.sexoSwitch.addEventListener('change', () => {
    state.sexo = els.sexoSwitch.checked ? 'femea' : 'macho';
    updateSexUI();
    scheduleRender();
  });
  els.castradoCheckbox.addEventListener('change', () => {
    state.castrado = els.castradoCheckbox.checked;
    scheduleRender();
  });
  els.idade.addEventListener('input', () => { state.idade = els.idade.value; scheduleRender(); });
  els.footer.addEventListener('input', () => { state.footerText = els.footer.value; scheduleRender(); });
  els.bannerColor.addEventListener('input', () => { state.bannerColor = els.bannerColor.value; scheduleRender(); });
  els.footerColor.addEventListener('input', () => { state.footerColor = els.footerColor.value; scheduleRender(); });

  function syncUIFromState(){
    els.name.value = state.name;
    els.nameFontSize.value = Math.round(state.nameFontScale * 100);
    els.nameFontSizeValue.textContent = Math.round(state.nameFontScale * 100) + '%';
    els.castradoCheckbox.checked = state.castrado;
    els.idade.value = state.idade;
    updateSexUI();
    els.footer.value = state.footerText;
    els.bannerColor.value = state.bannerColor;
    els.footerColor.value = state.footerColor;
    els.offsetY.value = state.panY;
    els.offsetYValue.textContent = state.panY + '%';
    els.zoom.value = state.zoom;
    els.zoomValue.textContent = state.zoom + '%';
  }

  els.resetBtn.addEventListener('click', () => {
    Object.assign(state, DEFAULTS);
    syncUIFromState();
    scheduleRender();
  });

  // ---- saved configurations (localStorage, this browser only) ----
  function readPresets(){
    try { return JSON.parse(localStorage.getItem(PRESETS_KEY) || '{}'); }
    catch(_) { return {}; }
  }
  function writePresets(presets){
    try { localStorage.setItem(PRESETS_KEY, JSON.stringify(presets)); return true; }
    catch(_) { return false; }
  }
  function refreshPresetSelect(selectName){
    const presets = readPresets();
    const names = Object.keys(presets).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    els.presetSelect.innerHTML = '';
    if (names.length === 0){
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = 'Nenhuma salva ainda';
      els.presetSelect.appendChild(opt);
      els.presetSelect.disabled = true;
    } else {
      els.presetSelect.disabled = false;
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        els.presetSelect.appendChild(opt);
      });
      if (selectName && names.includes(selectName)) els.presetSelect.value = selectName;
    }
  }

  els.savePresetBtn.addEventListener('click', () => {
    const name = (els.presetNameInput.value || '').trim();
    if (!name){
      els.presetSaveHint.textContent = 'Digite um nome para a configuração.';
      return;
    }
    const config = {};
    PRESET_FIELDS.forEach(key => { config[key] = state[key]; });
    const presets = readPresets();
    presets[name] = config;
    if (writePresets(presets)){
      els.presetSaveHint.textContent = `Configuração "${name}" salva.`;
      refreshPresetSelect(name);
    } else {
      els.presetSaveHint.textContent = 'Não foi possível salvar agora.';
    }
  });

  els.loadPresetBtn.addEventListener('click', () => {
    const name = els.presetSelect.value;
    if (!name) return;
    const config = readPresets()[name];
    if (!config) return;
    PRESET_FIELDS.forEach(key => {
      if (config[key] !== undefined) state[key] = config[key];
    });
    syncUIFromState();
    scheduleRender();
    els.presetSaveHint.textContent = `Configuração "${name}" restaurada.`;
  });

  let pendingDeleteName = null;
  let pendingDeleteTimer = null;

  function resetDeleteConfirm(){
    pendingDeleteName = null;
    if (pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
    els.deletePresetBtn.textContent = 'Excluir selecionada';
    els.deletePresetBtn.classList.remove('danger');
  }

  els.presetSelect.addEventListener('change', resetDeleteConfirm);

  els.deletePresetBtn.addEventListener('click', () => {
    const name = els.presetSelect.value;
    if (!name) return;

    if (pendingDeleteName !== name){
      pendingDeleteName = name;
      els.deletePresetBtn.textContent = 'Confirmar exclusão?';
      els.deletePresetBtn.classList.add('danger');
      els.presetSaveHint.textContent = `Clique de novo para excluir "${name}".`;
      if (pendingDeleteTimer) clearTimeout(pendingDeleteTimer);
      pendingDeleteTimer = setTimeout(resetDeleteConfirm, 4000);
      return;
    }

    const presets = readPresets();
    delete presets[name];
    writePresets(presets);
    resetDeleteConfirm();
    refreshPresetSelect();
    els.presetSaveHint.textContent = `Configuração "${name}" excluída.`;
  });

  refreshPresetSelect();

  els.canvasWrap.addEventListener('click', () => {
    els.canvasWrap.classList.toggle('expanded');
  });

  updateSexUI();

  // font loading
  Promise.all([
    document.fonts.load('800 76px Poppins'),
    document.fonts.load('700 42px Poppins'),
    document.fonts.load('600 30px Poppins'),
    document.fonts.load('500 27px Poppins'),
    document.fonts.load('400 24px "Varela Round"'),
    document.fonts.load('800 76px Montserrat'),
    document.fonts.load('600 30px Montserrat')
  ]).catch(() => {}).then(render);
  render();

  // downloads capability
  (async () => {
    let downloadsCap = null;
    try {
      if (window.claude && window.claude.use) {
        downloadsCap = await window.claude.use('downloads');
      }
    } catch(_) { downloadsCap = null; }

    if (!downloadsCap){
      els.downloadBtn.style.display = 'none';
      els.downloadHint.textContent = 'Download indisponível nesta visualização — abra a página publicada.';
      return;
    }

    els.downloadBtn.disabled = false;
    els.downloadBtn.textContent = 'Baixar imagem';

    els.downloadBtn.addEventListener('click', () => {
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const base = (state.name || 'cartao-adocao')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'cartao-adocao';
        try {
          els.downloadBtn.disabled = true;
          await downloadsCap.save({ filename: base + '.png', data: blob });
          els.downloadHint.textContent = 'Imagem salva.';
        } catch (err) {
          if (err && err.code === 'declined'){
            els.downloadHint.textContent = '';
          } else {
            els.downloadHint.textContent = 'Não foi possível baixar agora. Tente novamente.';
          }
        } finally {
          els.downloadBtn.disabled = false;
        }
      }, 'image/png', 1.0);
    });
  })();
})();
</script>
</body>
</html>
