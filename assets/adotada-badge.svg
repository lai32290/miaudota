<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- house roof: full house silhouette + offset chimney peak -->
  <path d="M 4 128 L 98 38 L 114 53 L 138 24 L 156 58 L 196 128 Z" fill="#22A83E"/>
  <!-- house wall -->
  <rect x="22" y="118" width="156" height="76" rx="8" fill="#CBCBB6"/>
  <!-- doorway -->
  <path d="M 46 194 L 46 156 Q 46 138 64 138 Q 82 138 82 156 L 82 194 Z" fill="#0A0A0A"/>

  <!-- cat tail curl (drawn first, sits behind the body) -->
  <path d="M 150 168 C 164 174, 178 168, 178 154 C 178 146, 172 141, 165 142" fill="none" stroke="#E670D8" stroke-width="14" stroke-linecap="round"/>

  <!-- cat body (draped down-left from the head, gripping the roof) -->
  <path d="M 130 68
           C 105 66, 82 80, 72 104
           C 64 124, 66 146, 82 160
           C 98 173, 126 176, 145 166
           C 160 158, 165 138, 158 120
           C 152 104, 144 82, 130 68 Z" fill="#E670D8"/>

  <!-- front leg reaching down to the roof edge -->
  <path d="M 95 92 C 82 100, 74 112, 74 126" fill="none" stroke="#E670D8" stroke-width="17" stroke-linecap="round"/>

  <!-- cat head -->
  <circle cx="152" cy="62" r="42" fill="#E670D8"/>
  <!-- ears -->
  <path d="M 118 38 L 106 -2 L 154 30 Z" fill="#E670D8"/>
  <path d="M 188 38 L 202 0 L 160 28 Z" fill="#E670D8"/>
  <!-- inner ear shade -->
  <path d="M 122 31 L 116 9 L 139 28 Z" fill="#6A2168"/>
  <path d="M 183 31 L 190 11 L 165 27 Z" fill="#6A2168"/>

  <!-- stripes on head -->
  <path d="M 133 24 Q 137 33 135 42" stroke="#6A2168" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 169 23 Q 166 32 169 41" stroke="#6A2168" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 152 18 L 152 31" stroke="#6A2168" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- stripes on body -->
  <path d="M 140 90 Q 152 96 154 108" stroke="#6A2168" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 100 110 Q 90 118 90 130" stroke="#6A2168" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- eyes (content, closed) -->
  <path d="M 132 60 Q 140 53 148 60" stroke="#3a0f38" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 158 59 Q 166 52 174 59" stroke="#3a0f38" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M 149 72 L 155 72 L 152 77 Z" fill="#3a0f38"/>
  <!-- mouth -->
  <path d="M 152 77 Q 147 83 140 80" stroke="#3a0f38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 152 77 Q 157 83 164 80" stroke="#3a0f38" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- chin/chest patch -->
  <ellipse cx="128" cy="86" rx="16" ry="12" fill="#fbf3fa"/>

  <!-- front paws hanging over the doorway -->
  <ellipse cx="72" cy="132" rx="14" ry="10" fill="#fbf3fa" transform="rotate(-15 72 132)"/>
  <ellipse cx="100" cy="168" rx="14" ry="10" fill="#fbf3fa" transform="rotate(8 100 168)"/>
</svg>
